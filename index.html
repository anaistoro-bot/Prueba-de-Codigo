
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Una pequeña página llena de palabras y sentimientos."
  >

  <title>愛 &lt;3</title>

  <style>

    /* =========================
       PALETA DE COLORES
       ========================= */

    :root {
      --vanilla: #FFF7E6;
      --blush: #F7C8D3;
      --rosewood: #B46A72;
      --sage: #A8B58A;
      --misty: #A9B7C6;
      --midnight: #2D3A47;
    }


    /* =========================
       CONFIGURACIÓN GENERAL
       ========================= */

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;

      display: grid;
      place-items: center;

      padding: 24px;

      overflow-x: hidden;

      color: var(--midnight);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(247, 200, 211, 0.75),
          transparent 32%
        ),

        radial-gradient(
          circle at 90% 90%,
          rgba(168, 181, 138, 0.55),
          transparent 32%
        ),

        var(--vanilla);
    }


    /* =========================
       DECORACIONES
       ========================= */

    .decoracion {
      position: fixed;

      width: 230px;
      height: 230px;

      border-radius: 50%;

      filter: blur(2px);

      opacity: 0.55;

      pointer-events: none;
    }

    .decoracion.uno {
      top: -95px;
      right: -70px;

      background:
        linear-gradient(
          135deg,
          var(--rosewood),
          var(--blush)
        );
    }

    .decoracion.dos {
      bottom: -120px;
      left: -70px;

      background:
        linear-gradient(
          135deg,
          var(--sage),
          var(--misty)
        );
    }


    /* =========================
       TARJETA PRINCIPAL
       ========================= */

    main {
      position: relative;

      width: min(100%, 780px);

      padding: clamp(32px, 7vw, 70px);

      text-align: center;

      border:
        1px solid
        rgba(180, 106, 114, 0.25);

      border-radius: 30px;

      background:
        rgba(255, 247, 230, 0.90);

      box-shadow:
        0 24px 70px
        rgba(45, 58, 71, 0.16);

      backdrop-filter: blur(12px);

      animation:
        aparecer 700ms ease-out both;
    }


    /* =========================
       ETIQUETA
       ========================= */

    .etiqueta {
      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 20px;

      padding: 8px 14px;

      color: var(--rosewood);

      font-size: 0.82rem;

      font-weight: 750;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      border:
        1px solid
        rgba(180, 106, 114, 0.28);

      border-radius: 999px;

      background:
        rgba(247, 200, 211, 0.45);
    }


    /* =========================
       PUNTO
       ========================= */

    .punto {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--sage);

      box-shadow:
        0 0 0 4px
        rgba(168, 181, 138, 0.22);
    }


    /* =========================
       TITULO
       ========================= */

    h1 {
      margin: 0;

      color: var(--midnight);

      font-size:
        clamp(2.6rem, 9vw, 5.7rem);

      line-height: 0.95;

      letter-spacing: -0.065em;
    }

    h1 span {
      color: var(--rosewood);
    }


    /* =========================
       FRASE PRINCIPAL
       ========================= */

    .descripcion {
      max-width: 560px;

      margin: 24px auto 18px;

      color: var(--midnight);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-style: italic;

      font-size:
        clamp(1rem, 2.5vw, 1.18rem);

      line-height: 1.7;
    }


    /* =========================
       TEXTO PEQUEÑO
       ========================= */

    .subtexto {
      max-width: 500px;

      margin: 0 auto 30px;

      color: var(--rosewood);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-style: italic;

      font-size: 0.98rem;

      line-height: 1.6;
    }


    /* =========================
       BOTÓN
       ========================= */

    button {
      padding: 14px 24px;

      color: var(--vanilla);

      font: inherit;

      font-weight: 750;

      border: 0;

      border-radius: 14px;

      background:
        linear-gradient(
          110deg,
          var(--rosewood),
          var(--midnight)
        );

      box-shadow:
        0 12px 24px
        rgba(45, 58, 71, 0.22);

      cursor: pointer;

      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        background 180ms ease;
    }

    button:hover {
      transform: translateY(-3px);

      background:
        linear-gradient(
          110deg,
          var(--midnight),
          var(--rosewood)
        );

      box-shadow:
        0 16px 28px
        rgba(45, 58, 71, 0.28);
    }

    button:active {
      transform: translateY(0);
    }


    /* =========================
       MENSAJE SECRETO
       ========================= */

    #mensaje {
      min-height: 55px;

      max-width: 560px;

      margin: 25px auto 0;

      padding: 0 10px;

      color: var(--rosewood);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-style: italic;

      font-size: 1.08rem;

      line-height: 1.6;

      opacity: 0;

      transform:
        translateY(8px);

      transition:
        opacity 400ms ease,
        transform 400ms ease;
    }

    #mensaje.mostrar {
      opacity: 1;

      transform:
        translateY(0);
    }


    /* =========================
       CORAZÓN DECORATIVO
       ========================= */

    .corazon {
      display: inline-block;

      margin-top: 12px;

      color: var(--rosewood);

      font-size: 22px;

      opacity: 0;

      transform: scale(0.5);

      transition:
        opacity 400ms ease,
        transform 400ms ease;
    }

    .corazon.mostrar {
      opacity: 0.8;

      transform: scale(1);

      animation:
        latido 1.2s ease-in-out infinite;
    }


    /* =========================
       FOOTER
       ========================= */

    footer {
      margin-top: 32px;

      color: var(--midnight);

      opacity: 0.65;

      font-size: 0.86rem;
    }


    /* =========================
       DETALLES DECORATIVOS
       ========================= */

    main::before {
      content: "✿";

      position: absolute;

      top: 22px;
      right: 30px;

      color: var(--rosewood);

      font-size: 28px;

      opacity: 0.55;
    }

    main::after {
      content: "✿";

      position: absolute;

      bottom: 20px;
      left: 30px;

      color: var(--sage);

      font-size: 22px;

      opacity: 0.55;
    }


    /* =========================
       ANIMACIONES
       ========================= */

    @keyframes aparecer {

      from {
        opacity: 0;

        transform:
          translateY(18px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }

    @keyframes latido {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.18);
      }

    }


    /* =========================
       ACCESIBILIDAD
       ========================= */

    @media (prefers-reduced-motion: reduce) {

      main {
        animation: none;
      }

      button {
        transition: none;
      }

      #mensaje {
        transition: none;
      }

      .corazon {
        animation: none;
      }

    }


    /* =========================
       CELULARES
       ========================= */

    @media (max-width: 600px) {

      body {
        padding: 16px;
      }

      main {
        padding: 42px 24px;

        border-radius: 24px;
      }

      main::before {
        top: 14px;
        right: 18px;
      }

      main::after {
        bottom: 14px;
        left: 18px;
      }

      h1 {
        font-size: 3.5rem;
      }

    }

  </style>
</head>


<body>

  <!-- DECORACIONES -->

  <div
    class="decoracion uno"
    aria-hidden="true">
  </div>

  <div
    class="decoracion dos"
    aria-hidden="true">
  </div>


  <!-- CONTENIDO -->

  <main>

    <div class="etiqueta">

      <span class="punto"></span>

      Un pequeño mensaje

    </div>


    <h1>
      愛<span>&lt;♡</span>
    </h1>


    <p class="descripcion">

      "Me perdí en su mirada, no eran ni azules, ni verdes.
      Eran color café, café que quita el sueño,
      café que produce desvelos". 
      - Mario Benedetti

    </p>


    <p class="subtexto">

    

    </p>


    <button
      id="boton"
      type="button">

      ♡ Descubrir ♡

    </button>


    <p
      id="mensaje"
      aria-live="polite">
    </p>


    <div
      id="corazon"
      class="corazon"
      aria-hidden="true">

      ♥
      
    </div>


    <footer>

      Hecho con HTML, CSS y un poquito de JavaScript ♡

    </footer>

  </main>


  <!-- JAVASCRIPT -->

  <script>

    const boton =
      document.querySelector("#boton");

    const mensaje =
      document.querySelector("#mensaje");

    const corazon =
      document.querySelector("#corazon");


    const frases = [

      "A veces una mirada dice mucho más de lo que las palabras podrían explicar.",

      "Hay personas que llegan sin avisar y terminan quedándose en nuestros pensamientos.",

      "Quizás algunas historias comienzan simplemente con una mirada.",

      "Hay momentos pequeños que, sin saber por qué, terminan significándolo todo.",

      "Una mirada puede durar solo unos segundos, pero quedarse en la memoria durante mucho tiempo.",

      "Hay personas que hacen que una simple conversación se convierta en un recuerdo especial.",

      "A veces no hace falta decir nada; una mirada puede decirlo todo.",

      "Quizás lo bonito no sea saber qué pasará, sino disfrutar aquello que estamos sintiendo ahora.",

      "Entre tantas personas, hay miradas que simplemente se sienten diferentes.",

      "Algunas coincidencias parecen demasiado bonitas para ser solamente coincidencias."

    ];


    let ultimaFrase = -1;


    boton.addEventListener("click", () => {

      let nuevaFrase;


      /* Evita repetir inmediatamente
         la misma frase */

      do {

        nuevaFrase =
          Math.floor(
            Math.random() * frases.length
          );

      } while (
        nuevaFrase === ultimaFrase
      );


      ultimaFrase =
        nuevaFrase;


      /* Cambiar el texto */

      mensaje.textContent =
        frases[nuevaFrase];


      /* Activar animación */

      mensaje.classList.remove("mostrar");

      corazon.classList.remove("mostrar");


      setTimeout(() => {

        mensaje.classList.add("mostrar");

        corazon.classList.add("mostrar");

      }, 50);


      /* Cambiar texto del botón */

      boton.textContent =
        "♡ Descubrir otro ♡";

    });

  </script>

</body>
</html>
